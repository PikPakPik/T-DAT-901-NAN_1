apiVersion: 1

providers:
  - name: 'crypto'
    orgId: 1
    folder: 'Crypto'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/crypto
    tags:
      - crypto
      - trading
      - binance
      - real-time
