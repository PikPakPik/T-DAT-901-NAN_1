services:
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093  
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 9090:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      - kafka

  scrapper-websocket:
    build:
      context: .docker/
      dockerfile: dev.Dockerfile
    volumes:
      - ./scrapper-websocket:/usr/share/app
    depends_on:
      - kafka
    environment:
      BINANCE_WEBSOCKET_URL: ${BINANCE_WEBSOCKET_URL}
      BINANCE_AGGREGATE_TRADE_STEAMS: ${BINANCE_AGGREGATE_TRADE_STEAMS}
      BINANCE_KLINE_STREAMS: ${BINANCE_KLINE_STREAMS}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}

  scrapper:
    build:
      context: .docker/
      dockerfile: dev.Dockerfile
    volumes:
      - ./scrapper:/usr/share/app

  influxdb:
    image: influxdb:alpine
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - ${INFLUXDB_PORT:-8086}:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE:-setup}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDBV2_ADMIN_TOKEN}
  grafana:
    image: grafana/grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data_cryptoviz:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped
    ports:
      - ${GRAFANA_PORT:-3000}:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
      DOCKER_INFLUXDBV2_ADMIN_TOKEN: ${DOCKER_INFLUXDBV2_ADMIN_TOKEN}

  spark-master:
    container_name: spark-master
    image: bitnami/spark:latest
    depends_on:
      - scrapper-websocket
      - scrapper
      - kafka
      - influxdb
    expose:
      - 7077
    ports:
      - ${SPARK_UI_PORT:-8080}:8080
    environment:
      SPARK_RPC_AUTHENTICATION_ENABLED: no
      SPARK_RPC_ENCRYPTION_ENABLED: no
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: no
      SPARK_SSL_ENABLED: no
      SPARK_MASTER_HOST: spark-master
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_DEFAULT_TOPIC: ${KAFKA_DEFAULT_TOPIC:-kafka__default_topic}
      KAFKA_TRANSACTION_TOPIC: ${KAFKA_TRANSACTION_TOPIC:-kafka__transaction_topic}
      INFLUXDB_HOST: influxdb
      INFLUXDB_V2_URL: http://influxdb:8086
      INFLUXDB_V2_TOKEN: ${INFLUXDBV2_ADMIN_TOKEN}
      INFLUXDB_V2_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      INFLUXDB_V2_VERIFY_SSL: ${INFLUXDB_V2_VERIFY_SSL:-false}
      INFLUXDB_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
    volumes:
      - spark-data:/opt/bitnami/spark/spark/data

  spark-worker:
    image: bitnami/spark:latest
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
      SPARK_MASTER_URL: spark://spark-master:7077
      
volumes:
  influxdb_data: {}
  grafana_data_cryptoviz: {}
  spark-data: {}