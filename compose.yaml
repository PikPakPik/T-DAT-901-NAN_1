services:
  consumer:
    build:
      context: .docker/
      dockerfile: dev.Dockerfile
    volumes:
      - ./consumer:/usr/share/app
    environment:
      BINANCE_WEBSOCKET_URL: "wss://stream.binance.com:443/stream?streams="
      BINANCE_AGGREGATE_TRADE_STEAMS: btcusdt@aggTrade,ethusdt@aggTrade
      BINANCE_KLINE_STREAMS: btcusdt@kline_1m,ethusdt@kline_1m

  scrapper:
    build:
      context: .docker/
      dockerfile: dev.Dockerfile
    volumes:
      - ./scrapper:/usr/share/app

  influxdb:
    image: influxdb:alpine
    volumes:
      - influxdb_data:/var/lib/influxdb
    ports:
      - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: administrator
      DOCKER_INFLUXDB_INIT_PASSWORD: p@ssw0rd
      DOCKER_INFLUXDB_INIT_ORG: cryptoviz
      DOCKER_INFLUXDB_INIT_BUCKET: home

  grafana:
    image: grafana/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: administrator
      GF_SECURITY_ADMIN_PASSWORD: p@ssw0rd

  spark:
    image: bitnami/spark:latest
    ports:
      - 7077:7077
    environment:
      SPARK_MODE: master
      SPARK_MASTER_URL: spark://spark:7077

  kafka:
    image: apache/kafka:latest
    hostname: kafka
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

volumes:
  influxdb_data: {}
  grafana_data: {}