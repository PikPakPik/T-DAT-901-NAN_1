services:
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      # KRaft configuration
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx1g"
      # Format storage on first run
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:29092 || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 6
      start_period: 40s
  
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 9090:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    depends_on:
      kafka:
        condition: service_healthy

  scrapper-websocket:
    image: python:alpine
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"
    working_dir: /usr/share/app
    volumes:
      - ./scrapper-websocket:/usr/share/app
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BINANCE_WEBSOCKET_URL: ${BINANCE_WEBSOCKET_URL}
      BINANCE_AGGREGATE_TRADE_STEAMS: ${BINANCE_AGGREGATE_TRADE_STEAMS}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      TOPIC_TRADE: ${TOPIC_TRADE:-trade}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}

  scrapper-ws-mock:
    image: python:alpine
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python ws-mocked.py"
    working_dir: /usr/share/app
    volumes:
      - ./scrapper-websocket:/usr/share/app
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      TOPIC_TRADE: ${TOPIC_TRADE:-trade}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      MOCK_EVENTS_PER_SECOND: ${MOCK_EVENTS_PER_SECOND:-100}

  scrapper:
    image: python:alpine
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"
    working_dir: /usr/share/app
    volumes:
      - ./scrapper:/usr/share/app

  influxdb:
    image: influxdb:alpine
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - ${INFLUXDB_PORT:-8086}:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE:-setup}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD:-changeme123}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG:-cryptoviz}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET:-home}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDBV2_ADMIN_TOKEN:-changeme123token}
  
  grafana:
    image: grafana/grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data_cryptoviz:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped
    ports:
      - ${GRAFANA_PORT:-3000}:3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
      DOCKER_INFLUXDBV2_ADMIN_TOKEN: ${DOCKER_INFLUXDBV2_ADMIN_TOKEN}

  stream-processor:
    build:
      context: ./stream-processor
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      TOPIC_TRADE: ${TOPIC_TRADE:-trade}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${DOCKER_INFLUXDBV2_ADMIN_TOKEN}
      INFLUX_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      INFLUX_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      KAFKA_BATCH_SIZE: ${KAFKA_BATCH_SIZE:-100}
      KAFKA_POLL_TIMEOUT_MS: ${KAFKA_POLL_TIMEOUT_MS:-100}
      KAFKA_MAX_POLL_RECORDS: ${KAFKA_MAX_POLL_RECORDS:-1000}
      AGGR_INTERVAL_SECONDS: ${AGGR_INTERVAL_SECONDS:-1.0}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-tdat901nan1}
      INSTANCE_ID: ${HOSTNAME}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

  
      
volumes:
  influxdb_data: {}
  grafana_data_cryptoviz: {}
  kafka_data: {}